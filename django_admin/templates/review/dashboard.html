<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>FastAPI Blur Trimmer Review</title></head>
<body>
  <h1>FastAPI Blur Trimmer Review</h1>
  <p>Read-only review of jobs created by the FastAPI service. <a href="/admin/">Admin</a></p>
  <table><thead><tr><th>Job</th><th>Status</th><th>Created</th><th>Export</th></tr></thead>
  <tbody>{% for job in jobs %}<tr><td>{{ job.id }}</td><td>{{ job.status }}</td><td>{{ job.created_at }}</td><td>{{ job.export_path|default:"—" }}</td></tr>{% empty %}<tr><td colspan="4">No jobs yet.</td></tr>{% endfor %}</tbody></table>
</body></html>
