name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev nlohmann-json3-dev
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Run API tests
        run: pytest api/tests -q
      - name: Validate Flask dashboard
        run: python -c "from flask_dashboard.app import app; assert app.test_client().get('/health').status_code == 200"
      - name: Validate MCP adapter
        run: python -c "import mcp_server.server"
      - name: Configure C++ engine
        run: cmake -S . -B build
      - name: Build C++ engine
        run: cmake --build build --parallel
      - name: Verify original blur-boundary algorithm
        run: ctest --test-dir build --output-on-failure
      - name: Build Docker image
        run: docker build -t ai-video-editor:${{ github.sha }} .
