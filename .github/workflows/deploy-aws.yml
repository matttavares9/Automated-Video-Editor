name: Deploy to Elastic Beanstalk

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: elastic-beanstalk-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify release is current and contains the browser app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          test "$RELEASE_SHA" = "$latest_sha" || { echo 'A newer commit exists; skip this release.'; exit 1; }
          test -f start-web.sh || { echo 'Missing browser application startup script.'; exit 1; }
          grep -q 'start-web.sh' Dockerfile || { echo 'Dockerfile does not start the browser application.'; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: registry
      - name: Build and publish the deployment image
        env:
          REGISTRY: ${{ steps.registry.outputs.registry }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/automated-video-editor:${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --platform linux/amd64 -t "$image" .
          docker push "$image"
          echo "DEPLOY_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Package the prebuilt image for Elastic Beanstalk
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/deployment"
          mkdir -p "$bundle"
          jq -n --arg image "$DEPLOY_IMAGE" '{AWSEBDockerrunVersion:"1",Image:{Name:$image,Update:"true"},Ports:[{ContainerPort:"8000"}]}' > "$bundle/Dockerrun.aws.json"
          for directory in .ebextensions .platform; do
            if [ -d "$directory" ]; then cp -R "$directory" "$bundle/"; fi
          done
          cd "$bundle"
          zip -r "$RUNNER_TEMP/release.zip" .
      - name: Deploy and verify Elastic Beanstalk
        env:
          EB_APP: ${{ vars.EB_APPLICATION_NAME || 'ai-video-editor' }}
          EB_ENV: ${{ vars.EB_ENVIRONMENT_NAME || 'ai-video-editor-dev' }}
          EB_BUCKET: ${{ vars.EB_DEPLOY_BUCKET }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          : "${EB_APP:?Set EB_APPLICATION_NAME}" "${EB_ENV:?Set EB_ENVIRONMENT_NAME}" "${EB_BUCKET:?Set EB_DEPLOY_BUCKET}"
          version="github-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          key="releases/${version}.zip"
          aws s3 cp "$RUNNER_TEMP/release.zip" "s3://${EB_BUCKET}/${key}"
          aws elasticbeanstalk create-application-version --application-name "$EB_APP" --version-label "$version" --source-bundle "S3Bucket=${EB_BUCKET},S3Key=${key}" --process
          for attempt in $(seq 1 24); do
            version_status="$(aws elasticbeanstalk describe-application-versions --application-name "$EB_APP" --version-labels "$version" --query 'ApplicationVersions[0].Status' --output text)"
            echo "Elastic Beanstalk bundle validation: ${version_status}"
            case "$version_status" in
              Processed|PROCESSED) break ;;
              Failed|FAILED)
                aws elasticbeanstalk describe-events --application-name "$EB_APP" --max-records 20 --query 'Events[?Severity==`ERROR`].[EventDate,Message]' --output table
                exit 1
                ;;
              *) sleep 5 ;;
            esac
          done
          case "$version_status" in Processed|PROCESSED) ;; *) echo 'Timed out waiting for Elastic Beanstalk bundle validation.'; exit 1 ;; esac
          aws elasticbeanstalk wait environment-updated --application-name "$EB_APP" --environment-names "$EB_ENV"
          aws elasticbeanstalk update-environment --application-name "$EB_APP" --environment-name "$EB_ENV" --version-label "$version"
          aws elasticbeanstalk wait environment-updated --application-name "$EB_APP" --environment-names "$EB_ENV"
          actual="$(aws elasticbeanstalk describe-environments --application-name "$EB_APP" --environment-names "$EB_ENV" --query 'Environments[0].VersionLabel' --output text)"
          test "$actual" = "$version" || {
            echo "Environment deployed ${actual}; expected ${version}. Recent Elastic Beanstalk errors:"
            aws elasticbeanstalk describe-events --environment-name "$EB_ENV" --max-records 20 --query 'Events[?Severity==`ERROR`].[EventDate,Message]' --output table
            exit 1
          }
          cname="$(aws elasticbeanstalk describe-environments --application-name "$EB_APP" --environment-names "$EB_ENV" --query 'Environments[0].CNAME' --output text)"
          curl --fail --silent --show-error --retry 5 --retry-delay 10 "http://${cname}/health"
